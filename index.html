<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangle tangram puzzle</title>
<style>
  :root {
    --bg: #F7F6F2; --card: #FFFFFF; --text: #232320; --text-secondary: #5F5E5A;
    --border: #D3D1C7; --border-strong: #B4B2A9; --accent: #378ADD; --accent-text:#042C53;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181A; --card:#212226; --text:#EDECE8; --text-secondary:#B4B2A9;
             --border:#3A3B3E; --border-strong:#54565A; --accent:#85B7EB; --accent-text:#E6F1FB; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--text); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 16px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  #status { font-size: 15px; color: var(--text-secondary); }
  button { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border-strong);
           background: var(--card); color: var(--text); font-size: 15px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  button.primary { border-color: var(--accent); color: var(--accent-text); }
  #boardWrap { display:flex; justify-content:center; }
  #board { width:100%; max-width: 900px; background:var(--card); border-radius: 16px; border:1px solid var(--border); }
  .btnbar { display:flex; gap:8px; flex-wrap:wrap; }
  .piece-g { transition: transform 1s cubic-bezier(.25,.9,.3,1.15); touch-action: none; }
  #pieceLayer { transition: opacity 0.3s ease; }
  .piece-g.dragging { transition: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Triangle tangram puzzle</h1>
  <p class="sub">Click Scramble to mix the 8 pieces (including the small bonus one), then drag them back — 7 into the big triangle, 1 into its own small socket.</p>

  <div class="row">
    <div id="status">Solved. Click Scramble to play.</div>
    <div class="btnbar">
      <button id="rotateBtn" aria-label="Rotate selected piece">&#8635; Rotate</button>
      <button id="flipBtn" aria-label="Flip selected piece">&#8646; Flip</button>
      <button id="scrambleBtn" class="primary">&#8635; Scramble</button>
      <button id="newGameBtn">&#8635; New Game</button>
    </div>
  </div>

  <div id="boardWrap">
    <svg id="board" viewBox="0 0 500 900" role="img" aria-label="Puzzle board">
      <title>Triangle puzzle board</title>
      <g id="coverLayer"></g>
      <g id="targetLayer"></g>
      <g id="pieceLayer"></g>
    </svg>
  </div>
</div>

<script>
const WOOD_FILL = "#E4D2A8";
const WOOD_STROKE = "#8B6F47";
const PIECES = [
  {"local":[[29.16,-108.49],[-58.31,30.91],[29.16,77.58]],"target":[198.92,148.49],"color":"#D4534B"},
  {"local":[[-31.73,-68.84],[-77.04,3.41],[55.73,75.66],[55.73,-22.18]],"target":[172.34,248.24],"color":"#7F77DD"},
  {"local":[[-29.15,-48.17],[-74.46,24.08],[103.61,24.08]],"target":[124.46,299.82],"color":"#1D9E75"},
  {"local":[[-29.16,-108.49],[-29.16,77.58],[58.31,30.91]],"target":[257.23,148.49],"color":"#D85A30"},
  {"local":[[-58.31,0.03],[29.15,-46.64],[29.15,46.61]],"target":[286.38,226.04],"color":"#639922"},
  {"local":[[-39.18,-59.35],[-39.18,38.49],[48.29,38.49],[48.29,-12.77]],"target":[267.25,285.41],"color":"#BA7517"},
  {"local":[[-30.2,-96.33],[-30.2,48.17],[60.41,48.17]],"target":[345.74,275.73],"color":"#378ADD"},
  {"local":[[-30.0,-17.32],[30.0,-17.32],[0.0,34.64]],"target":[450.0,77.32],"color":"#D4534B","bonus":true}
];
const TRAY = [[90,370],[270,370],[450,370],[90,580],[270,580],[450,580],[90,790],[270,790]];
const PIECE_NUMS = [1,2,3,4,5,6,7,8];
const DARK_COLORS = ["#501313","#26215C","#04342C","#4A1B0C","#173404","#412402","#042C53","#501313"];
const ROT_STEP = 15; // finer rotate increment than the 60deg minimum needed to solve

function poly(pts){ return pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" "); }
function buildPiece(def, i){
  return { id:"p"+i, local:def.local, color:def.color, bonus: !!def.bonus,
           targetX:def.target[0], targetY:def.target[1], targetRot:0, targetFlip:1,
           x:def.target[0], y:def.target[1], rot:0, flip:1, solved:true, el:null, polyEl:null };
}
let pieces = PIECES.map((d,i)=>buildPiece(d,i));

const svgNS = "http://www.w3.org/2000/svg";
const boardSvg = document.getElementById("board");
const coverLayer = document.getElementById("coverLayer");
const pieceLayer = document.getElementById("pieceLayer");
const targetLayer = document.getElementById("targetLayer");
const statusEl = document.getElementById("status");
let selectedId = null;
let solvedCount = pieces.length;
let scrambled = false;

function drawCover(){
  coverLayer.innerHTML = "";
  // outer solid triangle, wood-toned, as the "not yet played" look
  const outer = document.createElementNS(svgNS,"polygon");
  outer.setAttribute("points", "228.08,40 50,323.9 406.15,323.9");
  outer.setAttribute("fill", WOOD_FILL);
  outer.setAttribute("stroke", WOOD_STROKE);
  outer.setAttribute("stroke-width","2");
  coverLayer.appendChild(outer);
  // faint seam lines matching the 7-piece cut lines
  pieces.filter(pc=>!pc.bonus).forEach(pc=>{
    const el = document.createElementNS(svgNS,"polygon");
    const pts = pc.local.map(([x,y])=>[x+pc.targetX, y+pc.targetY]);
    el.setAttribute("points", poly(pts));
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", WOOD_STROKE);
    el.setAttribute("stroke-width","1");
    el.setAttribute("opacity","0.6");
    coverLayer.appendChild(el);
  });
  // bonus piece sitting in its own small socket
  const bonusPc = pieces.find(pc=>pc.bonus);
  const bpts = bonusPc.local.map(([x,y])=>[x+bonusPc.targetX, y+bonusPc.targetY]);
  const bonusEl = document.createElementNS(svgNS,"polygon");
  bonusEl.setAttribute("points", poly(bpts));
  bonusEl.setAttribute("fill", WOOD_FILL);
  bonusEl.setAttribute("stroke", WOOD_STROKE);
  bonusEl.setAttribute("stroke-width","1.5");
  coverLayer.appendChild(bonusEl);
}

function drawTargets(){
  targetLayer.innerHTML = "";
  // just the outer socket outlines (no internal per-piece hints)
  const mainOutline = document.createElementNS(svgNS,"polygon");
  mainOutline.setAttribute("points", "228.08,40 50,323.9 406.15,323.9");
  mainOutline.setAttribute("fill", "none");
  mainOutline.setAttribute("stroke", "var(--border-strong)");
  mainOutline.setAttribute("stroke-width","1.5");
  mainOutline.setAttribute("stroke-dasharray","4,3");
  mainOutline.setAttribute("opacity", scrambled ? "1" : "0");
  targetLayer.appendChild(mainOutline);

  const bonusPc = pieces.find(pc=>pc.bonus);
  const bpts = bonusPc.local.map(([x,y])=>[x+bonusPc.targetX, y+bonusPc.targetY]);
  const bonusOutline = document.createElementNS(svgNS,"polygon");
  bonusOutline.setAttribute("points", poly(bpts));
  bonusOutline.setAttribute("fill", "none");
  bonusOutline.setAttribute("stroke", "var(--border-strong)");
  bonusOutline.setAttribute("stroke-width","1.5");
  bonusOutline.setAttribute("stroke-dasharray","4,3");
  bonusOutline.setAttribute("opacity", scrambled ? "1" : "0");
  targetLayer.appendChild(bonusOutline);
}

function transformStr(pc){
  return `translate(${pc.x.toFixed(2)}px, ${pc.y.toFixed(2)}px) rotate(${pc.rot}deg) scale(${pc.flip},1)`;
}

function buildDom(){
  pieceLayer.innerHTML = "";
  pieces.forEach(pc=>{
    const g = document.createElementNS(svgNS,"g");
    g.setAttribute("class","piece-g");
    g.setAttribute("data-id", pc.id);
    g.style.transformBox = "view-box";
    g.style.transformOrigin = "0px 0px";
    g.style.transform = transformStr(pc);
    g.style.cursor = "grab";
    const p1 = document.createElementNS(svgNS,"polygon");
    p1.setAttribute("points", poly(pc.local));
    p1.setAttribute("fill", pc.color);
    p1.setAttribute("stroke", "#FFFFFF");
    p1.setAttribute("stroke-width", "1.5");
    g.appendChild(p1);
    g.addEventListener("pointerdown", onPointerDown);
    pieceLayer.appendChild(g);
    pc.el = g;
    pc.polyEl = p1;
  });
}

function setSelected(id){
  if(selectedId){
    const prev = pieces.find(p=>p.id===selectedId);
    if(prev){ prev.polyEl.setAttribute("stroke","#FFFFFF"); prev.polyEl.setAttribute("stroke-width","1.5"); }
  }
  selectedId = id;
  if(id){
    const pc = pieces.find(p=>p.id===id);
    pc.polyEl.setAttribute("stroke","#000000");
    pc.polyEl.setAttribute("stroke-width","3");
  }
}

let drag = null;
function onPointerDown(e){
  const id = e.currentTarget.getAttribute("data-id");
  const pc = pieces.find(p=>p.id===id);
  if(pc.solved){ setSelected(id); return; }
  setSelected(id);
  const pt = clientToSvg(e.clientX, e.clientY);
  drag = { pc, startX: pt.x, startY: pt.y, origX: pc.x, origY: pc.y };
  pc.el.classList.add("dragging");
  pc.el.setPointerCapture(e.pointerId);
  pc.el.style.cursor = "grabbing";
  pieceLayer.appendChild(pc.el);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
}
function clientToSvg(clientX, clientY){
  const pt = boardSvg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = boardSvg.getScreenCTM().inverse();
  return pt.matrixTransform(ctm);
}
function onPointerMove(e){
  if(!drag) return;
  const pt = clientToSvg(e.clientX, e.clientY);
  drag.pc.x = drag.origX + (pt.x - drag.startX);
  drag.pc.y = drag.origY + (pt.y - drag.startY);
  drag.pc.el.style.transform = transformStr(drag.pc);
}
function onPointerUp(){
  if(!drag) return;
  drag.pc.el.classList.remove("dragging");
  drag.pc.el.style.cursor = "grab";
  checkSnap(drag.pc);
  drag = null;
  window.removeEventListener("pointermove", onPointerMove);
  window.removeEventListener("pointerup", onPointerUp);
}

function normRot(r){ return ((r % 360) + 360) % 360; }

function checkSnap(pc){
  const dx = pc.x - pc.targetX, dy = pc.y - pc.targetY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const rotOk = Math.abs(normRot(pc.rot) - normRot(pc.targetRot)) < 12;
  const flipOk = pc.flip === pc.targetFlip;
  if(dist < 18 && rotOk && flipOk){
    pc.x = pc.targetX; pc.y = pc.targetY; pc.rot = pc.targetRot; pc.flip = pc.targetFlip;
    pc.solved = true;
    pc.el.style.transform = transformStr(pc);
    pc.el.style.cursor = "default";
    solvedCount++;
    updateStatus();
  }
}

function updateStatus(){
  const total = pieces.length;
  statusEl.textContent = solvedCount >= total
    ? "Solved! All 8 pieces are in place."
    : `${solvedCount} of ${total} pieces placed.`;
}

document.getElementById("rotateBtn").addEventListener("click", ()=>{
  if(!selectedId) return;
  const pc = pieces.find(p=>p.id===selectedId);
  if(pc.solved) return;
  pc.rot = normRot(pc.rot + ROT_STEP);
  pc.el.style.transform = transformStr(pc);
});
document.getElementById("flipBtn").addEventListener("click", ()=>{
  if(!selectedId) return;
  const pc = pieces.find(p=>p.id===selectedId);
  if(pc.solved) return;
  pc.flip = pc.flip * -1;
  pc.el.style.transform = transformStr(pc);
});
document.getElementById("scrambleBtn").addEventListener("click", scramble);

function scramble(){
  if(!scrambled){
    coverLayer.style.opacity = "0";
    coverLayer.style.pointerEvents = "none";
    pieceLayer.style.display = "";
    pieceLayer.style.opacity = "0";
    // force layout so the browser registers the "before" transform frame
    // before we change it, otherwise the first move never transitions
    void pieceLayer.getBoundingClientRect();
    pieceLayer.style.opacity = "1";
  }
  drag = null;
  scrambled = true;
  drawTargets();
  const shuffledTray = TRAY.slice().sort(()=>Math.random()-0.5);
  // sweep left to right: order pieces by current x position before staggering
  const order = pieces.slice().sort((a,b)=>a.x-b.x);
  order.forEach((pc,i)=>{
    const t = shuffledTray[i];
    const newX = t[0] + (Math.random()*14-7);
    const newY = t[1] + (Math.random()*14-7);
    const newRot = Math.round((Math.random()*24))*ROT_STEP;
    setTimeout(()=>{
      pc.x = newX; pc.y = newY; pc.rot = newRot; pc.flip = 1; pc.solved = false;
      pc.el.style.transform = transformStr(pc);
      pc.el.style.cursor = "grab";
    }, 60 + i*200);
  });
  solvedCount = 0;
  setSelected(null);
  updateStatus();
}

function newGame(){
  drag = null;
  scrambled = false;
  selectedId = null;
  pieces.forEach(pc=>{
    pc.x = pc.targetX; pc.y = pc.targetY; pc.rot = pc.targetRot; pc.flip = pc.targetFlip;
    pc.solved = true;
    pc.el.style.transform = transformStr(pc);
    pc.el.style.cursor = "grab";
  });
  solvedCount = pieces.length;
  drawTargets();
  pieceLayer.style.opacity = "0";
  coverLayer.style.pointerEvents = "";
  setTimeout(()=>{
    pieceLayer.style.display = "none";
    coverLayer.style.opacity = "1";
  }, 320);
  updateStatus();
}
document.getElementById("newGameBtn").addEventListener("click", newGame);

buildDom();
drawCover();
drawTargets();
pieceLayer.style.display = "none";
</script>
</body>
</html>
